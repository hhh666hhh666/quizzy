server {
    # 宿主 nginx（宝塔）用 127.0.0.1 反代进来，Host 是域名或 IP；这里不挑 Host，一律接住。
    listen 80;
    server_name _;

    # 重定向一律发**相对** Location：容器内的 scheme/端口认知是 http/80，
    # 拼绝对 URL 会在宿主 TLS 反代后错成 http 跳转（实测 /m → http://…/m/ 丢宿主端口）。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限（10MB，见 quizzy-server 的 application.yml）对齐：
    # 两层 nginx 哪一层更严就先拒掉上传。
    client_max_body_size 12m;

    # index.html 绝不缓存：它引用的是带内容 hash 的产物，缓存住就会「新版上不去、要硬刷新」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Vite 产物带内容 hash（assets/xxx-<hash>.js|css），文件名一变即失效，可以长期强缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- 移动端 H5（uni-app 产物，挂子路径 /m/，hash 路由）----
    # 宿主宝塔 nginx 的 `location /` 会把 /m/ 原样反代进来，宿主侧零改动。

    # 入口文件同 PC 口径：绝不缓存
    location = /m/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # 产物同样带内容 hash，可以长期强缓存
    location /m/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # hash 路由下服务器只需处理 /m/ 本身；try_files 兜底覆盖「非 hash 路径误入」的情况
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    # 「/m 无尾斜杠」精确收回：发**相对** Location，别让容器内 nginx 用自己知道的
    # scheme/端口（http / 80）拼绝对 URL——在宿主 TLS 反代后面那会拼成 http 跳转。
    location = /m {
        return 301 /m/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://server:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # 宿主 nginx 已终止 TLS 并注入下面这些头，这里原样透传给后端：
        # - X-Forwarded-Proto 必须**透传**而不是用 $scheme：容器内 $scheme 永远是 http，
        #   用它会把 https 语义丢掉（application.yml 的 forward-headers-strategy 读的就是它）。
        # - X-Forwarded-For 用 $proxy_add_x_forwarded_for 追加本跳，链首仍是真实客户端。
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
    }
}
