server {
    # 宿主 nginx（宝塔）用 127.0.0.1 反代进来，Host 是域名或 IP；这里不挑 Host，一律接住。
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限（10MB，见 quizzy-server 的 application.yml）对齐：
    # 两层 nginx 哪一层更严就先拒掉上传。
    client_max_body_size 12m;

    # index.html 绝不缓存：它引用的是带内容 hash 的产物，缓存住就会「新版上不去、要硬刷新」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Vite 产物带内容 hash（assets/xxx-<hash>.js|css），文件名一变即失效，可以长期强缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://server:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # 宿主 nginx 已终止 TLS 并注入下面这些头，这里原样透传给后端：
        # - X-Forwarded-Proto 必须**透传**而不是用 $scheme：容器内 $scheme 永远是 http，
        #   用它会把 https 语义丢掉（application.yml 的 forward-headers-strategy 读的就是它）。
        # - X-Forwarded-For 用 $proxy_add_x_forwarded_for 追加本跳，链首仍是真实客户端。
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
    }
}
