# quizzy 对外入口模板 —— 宿主（宝塔）nginx 把站点反代到 web 容器的 127.0.0.1:8081
#
# ⚠️ 这份是「仓库里的对照模板」。**真正生效的那份在服务器的宝塔面板里、归宝塔管**
#    （宝塔 → 网站 → 设置 → 配置文件）。站点配置位于仓库之外，是已知的配置漂移源，
#    核对时以本模板为准。取舍见 docs/adr/0016-cloud-deploy-with-release-pipeline.md 的 Amendment 1。
#
# 两个阶段用同一个 upstream，只有 server_name 不同：
#   * 备案期间：server_name 填服务器 IP（8.137.172.6），纯 HTTP；
#   * 备案之后：server_name 填真实域名，由宝塔申请 Let's Encrypt 并在 443 终止 TLS，
#               80 那段改成 301 跳 https（宝塔的「强制 HTTPS」开关即生成）。

upstream quizzy_web {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    # 备案期间填 IP；备案后填域名（宝塔会同时写进 80 与 443 两个 server 块）
    server_name __SERVER_NAME__;

    # 与后端 multipart 上限（10MB，见 quizzy-server 的 application.yml）对齐：
    # 宿主这层不该比后端更早拒掉上传。
    client_max_body_size 12m;

    location / {
        proxy_pass http://quizzy_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # 这三行是关键：把真实客户端地址与 https 语义一并交给下游，
        # 容器 nginx 再透传给后端，Spring 才能认对 scheme 与 remote addr。
        # （application.yml 里的 server.forward-headers-strategy: framework 就是在读它们）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}

