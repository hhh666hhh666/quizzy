services:
  mysql:
    image: mysql:8
    container_name: quizzy-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: quizzy
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      - quizzy-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./quizzy-server
    image: quizzy-server:0.1.0
    container_name: quizzy-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quizzy?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  web:
    build: ./quizzy-web
    image: quizzy-web:0.1.0
    container_name: quizzy-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  quizzy-mysql-data:
