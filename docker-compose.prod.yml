# quizzy · 云上 prod 编排（阿里云轻量服务器）
#
# 形态：镜像来自 ACR（CI 构建推送，服务器只拉取、不构建、不 clone 仓库）；
#       对外入口是宿主 nginx（宝塔），web 容器只绑 127.0.0.1:8081。
# 取舍与逐条理由见 docs/adr/0016-cloud-deploy-with-release-pipeline.md（含 Amendment 1）。
#
# ⚠️ 本文件里**没有 build:**——2C2G 的服务器上跑 Maven 必 OOM，构建一律在 CI 上做。
# ⚠️ 变量来自服务器上的 /srv/quizzy/.env，而 compose 默认只找**自己所在目录**的 .env；
#    所以调用方（scripts/server-deploy.sh）一律显式 `--env-file /srv/quizzy/.env`。

name: quizzy   # 固定项目名，免得容器/网络名随 compose 目录名变化而漂移

# 三个服务统一的日志上限：Docker 默认的 json-file 不限制大小，40G 系统盘迟早被日志吃掉。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8
    container_name: quizzy-mysql
    restart: unless-stopped
    # 内核级内存硬顶（保险，不是配额）：取值 = 实测占用（161MB）的约 2.4 倍。
    # JVM/MySQL 自己的参数只管它们认识的内存；真出泄漏时让内核 OOM-kill 单个容器，
    # 而不是把整机拖到 swap、甚至杀掉别的容器。取值逻辑见 docs/operations/内存策略.md。
    mem_limit: 384m
    # ⚠️ 只绑**宿主回环**，不是 0.0.0.0。
    #    用途：让本机能经 SSH 隧道直连（IDEA 的数据库工具、临时排障都靠它），
    #    同时数据库仍不对公网开口。见 ADR 0016 的 Amendment 2。
    #    ⚠️ 必须写成 `127.0.0.1:3306:3306`。写成 `3306:3306` 等于绑 0.0.0.0，
    #       那才是真正的红线——改这一行之前先在服务器上 `ss -tlnp | grep 3306` 复查。
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 /srv/quizzy/.env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quizzy}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 2C2G：显式钉死缓冲池与连接数，不让默认值往上飘。
      # ⚠️ 首跑取 128M 而不是 256M：实测这台机可用内存只有 ~800MB，而 JVM 那边还要吃 400–600MB，
      #    两处都按「2C2G 的余量」配会合起来超预算——顶不住的表现是 OOM-killer 杀进程，
      #    症状却长成「健康检查永远不过」，极难联想到是内存。跑通、观察 free -m 有余量后再调回 256M。
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      # ---- 以下三条是 2026-10-10 按实测加的「省内存三刀」----
      # 依据：当天实测 MySQL 容器 RSS 533MB，用
      #   performance_schema.memory_summary_global_by_event_name 拆开发现：
      #   memory/performance_schema 一项独占 235MB（占容器内存 44%）、
      #   innodb_log_buffer_size 还是 64M 的默认值、table_open_cache 还是 4000 的默认值。
      # 1) 关掉 performance_schema —— 它是 MySQL 的性能诊断视图，本项目的排障从不依赖它，
      #    关掉**不影响任何业务功能**，却是全机单项最大的一笔可回收内存（235MB）。
      #    代价：以后要做细粒度 SQL 性能分析时，需临时改回 ON 并重建容器。
      - --performance-schema=OFF
      # 2) redo log buffer 64M → 16M —— 16M 是 MySQL 5.7 时代的默认值，8.0.30 起才被抬到 64M；
      #    本项目写入量小（自用刷题工具），16M 足够，省约 48MB。
      - --innodb-log-buffer-size=16M
      # 3) 表缓存 4000 → 400 —— 单库小应用同时打开的表远不到 400 张；调小只会让超出部分
      #    「重新打开文件」，不会报错，省数十 MB。
      - --table-open-cache=400
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:?请在 /srv/quizzy/.env 里设置 MYSQL_DATA_DIR（Linux 绝对路径）}
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  server:
    # 镜像 tag 跟随版本号，但由部署时传入（ADR 0015 Amendment 1：这里不再是字面量）。
    # ⚠️ compose 不支持 ${VAR#v} 截断，所以 tag 不带 v 这件事由部署脚本保证。
    image: ${ACR_REGISTRY:?未设置 ACR_REGISTRY}/${ACR_NAMESPACE:?未设置 ACR_NAMESPACE}/quizzy-server:${APP_VERSION:?未设置 APP_VERSION}
    container_name: quizzy-server
    restart: unless-stopped
    # 内核级内存硬顶：本项目 JVM 的**理论上限约 498MB**（`-Xmx` 只是堆的上限，
    # 还要加元空间/直接内存/代码缓存/线程栈/JVM 自身约 242MB，见
    # docs/operations/内存策略.md 的「上限模型」），640m 留约 1.3 倍余量。
    mem_limit: 640m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-quizzy}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 必填：默认值已随公开仓库泄露（ADR 0011 Amendment 1），缺失时 compose 在读配置阶段就退出。
      QUIZZY_JWT_SECRET: ${QUIZZY_JWT_SECRET:?请在 /srv/quizzy/.env 里设置 QUIZZY_JWT_SECRET}
      QUIZZY_JWT_EXPIRE_DAYS: ${QUIZZY_JWT_EXPIRE_DAYS:-7}
      # 同源部署默认不需要 CORS（前端与 /api 同域）；留空即完全不注册。见 WebConfig 的注释。
      QUIZZY_CORS_ALLOWED_ORIGINS: ${QUIZZY_CORS_ALLOWED_ORIGINS:-}
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8080
      # 2C2G 硬约束：钉死堆与元空间，避免 JVM 按宿主机 1.8GiB 自动放大。
      # 用 JAVA_TOOL_OPTIONS 而不是覆盖 entrypoint：① 不动镜像；② 不会把
      # `java -jar /app/app.jar` 抄进 compose 变成第二份会漂的真相源。
      # SerialGC 在 2 vCPU + 小堆下比 G1 更省。
      # ⚠️ 首跑取 -Xms128m -Xmx384m：这台机可用内存只有 ~800MB，mysql 已占 ~480MB，
      #    给 JVM 的余量比「2C2G 的理论值」小。超预算时 JVM 会被 OOM-killer 杀，
      #    而症状是健康检查不过。跑通、观察有余量后再调回 512m。
      # ---- 2026-10-10 二次压缩（依据：当天实测该容器 RSS 266.8MB、线程仅 32 个）----
      #   -Xmx 384m→256m：实测低负载下堆远没吃满，256m 仍有余量
      #   -Xss512k：线程栈减半（Linux x64 默认 1MB）
      #   -XX:TieredStopAtLevel=1：只用 C1 编译，省掉 C2 编译线程与大部分代码缓存；
      #       代价是长期吞吐略降——对低 QPS 的自用工具可忽略
      #   -XX:ReservedCodeCacheSize=48m：给代码缓存封顶（默认 240m，实际远用不到）
      #   MaxDirectMemorySize 48m→32m：无可观测的 NIO 压力
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=112m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
      # Tomcat 工作线程封顶（默认 200）：实测当前共 32 个线程（含 JVM 内部线程）。
      # 封顶是「防止某次并发高峰把内存顶穿」的保险，不是常态收益。
      SERVER_TOMCAT_THREADS_MAX: 32
    # 不发布端口：只经 web 容器的 nginx 暴露 /api/，Swagger 因此也不对外（ADR 0016）。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging

  web:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/quizzy-web:${APP_VERSION}
    container_name: quizzy-web
    restart: unless-stopped
    # 内核级内存硬顶：nginx + 静态文件实测仅 4MB，128m 纯属保险。
    mem_limit: 128m
    depends_on:
      server:
        condition: service_healthy
    # 只绑回环：对外入口交给宿主 nginx（宝塔），由它反代到 127.0.0.1:8081。
    # 绑回环而不是 0.0.0.0，是为了①不与宝塔抢 80/443、②web 不直接对公网可达。
    ports:
      - "127.0.0.1:8081:80"
    logging: *default-logging
