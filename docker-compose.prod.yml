services:
  mysql:
    image: mysql:8
    container_name: quizzy-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quizzy}
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      # 长语法写绑定挂载，避免 Windows 盘符（E:）被短语法的冒号切错
      - type: bind
        source: ${MYSQL_DATA_DIR:-E:/develop/docker/mysql8/var/lib/mysql}
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./quizzy-server
      # 版本号由 scripts/deploy.sh 算出并 export，compose 在解析配置时替换（ADR 0015）。
      # 这几个值**不进 .env**——.env 是密钥与本机配置的地盘（ADR 0011）。
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # 镜像 tag 跟随版本号，且必须是字面量：这样每个已发版本各留一份镜像，
    # 回滚可以直接复用本地镜像而不必重新构建（ADR 0015）。
    image: quizzy-server:1.1.0
    container_name: quizzy-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-quizzy}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # 必须显式配置：默认值已随公开仓库泄露，:? 会在 .env 缺失时直接报错退出，
      # 避免带着一把全网皆知的密钥上线。生成方式见 .env.example。
      QUIZZY_JWT_SECRET: ${QUIZZY_JWT_SECRET:?请在 .env 里设置 QUIZZY_JWT_SECRET（python -c "import secrets;print(secrets.token_hex(32))"）}
      QUIZZY_JWT_EXPIRE_DAYS: ${QUIZZY_JWT_EXPIRE_DAYS:-7}
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    # 没有 actuator，所以探 springdoc 的 /v3/api-docs：它能证明应用上下文真的起来了。
    # start_period 是给 Spring Boot 启动留的宽限期，这段时间内失败不计入 retries。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./quizzy-web
      # 四个都给前端：vite 会把它们 define 成 __APP_*__ 常量打进产物（ADR 0015）
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_AHEAD: ${APP_AHEAD:-0}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: quizzy-web:1.1.0
    container_name: quizzy-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
