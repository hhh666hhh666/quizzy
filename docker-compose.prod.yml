services:
  mysql:
    image: mysql:8
    container_name: quizzy-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quizzy}
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      # 长语法写绑定挂载，避免 Windows 盘符（E:）被短语法的冒号切错
      - type: bind
        source: ${MYSQL_DATA_DIR:-E:/develop/docker/mysql8/var/lib/mysql}
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./quizzy-server
    image: quizzy-server:0.1.0
    container_name: quizzy-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-quizzy}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      QUIZZY_JWT_SECRET: ${QUIZZY_JWT_SECRET:-quizzy-default-jwt-secret-please-replace-in-production-0123456789abcdef}
      QUIZZY_JWT_EXPIRE_DAYS: ${QUIZZY_JWT_EXPIRE_DAYS:-7}
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  web:
    build: ./quizzy-web
    image: quizzy-web:0.1.0
    container_name: quizzy-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
