name: CI

# 触发：主干 push + 指向主干的 PR。**不管 tag**——tag 的处置权统一收到 release.yml
# （版本门禁、构建推 ACR、部署都在那边），两边都跑只会白烧 runner 与 Docker Hub 的拉取配额。
# 用 GitHub 托管 runner，不用 self-hosted：本仓库是 public 的，
# 把 runner 装在开发机上等于让任何能开 PR 的人在那台机器上执行代码（见 ADR 0013）。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 最小权限：只读代码。不推镜像、不发包、不改 PR，所以不需要任何写权限。
permissions:
  contents: read

# 同一分支上连续 push 时只保留最新一次运行，省 runner 也省 Docker Hub 的拉取配额。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 放最前面：只靠 runner 自带的 bash + git + grep + find，不需要任何 toolchain，几秒就跑完；
  # 而「文档或注释指向了不存在的文件」「新模块忘了配测试」是最容易混进主干的人为失误，
  # 让它们在另外几个重 job 还在装依赖、拉镜像时就先给出信号。同样不设 needs，与 docker 两个 job 一致。
  # 它现在承载两条约定自检：文档链接（下）与模块测试守卫（再下）。
  # 这套 AI 协作纪律本身的取舍记在 docs/adr/0014-ai-discipline-in-repo.md。
  docs:
    name: 文档 · 链接与引用自检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 查两类：md 里 ](./x) 的相对链接要存在，脚本/注释里提到的 docs/ scripts/
      # .github/ 路径也要存在。后者是刻意加的——移动或删除文件时注释里的路径不会
      # 报任何错，是最沉默的一类失效；而 ADR 0006 要求文档只写「去哪看」，
      # 指过去是空的等于没写。
      - name: 跑 scripts/check-doc-links.sh
        run: bash scripts/check-doc-links.sh

      # 另一类沉默的失效：新加了模块、忘了配测试。它同样不报错，只会让安全网一直缺一块。
      # ⚠️ 这条只验「有没有测试类」，验不了断言质量——防遗忘的兜底，不是质量保证
      #    （见 ADR 0021 的 Consequences 与 scripts/check-module-tests.sh 的头部）。
      - name: 跑 scripts/check-module-tests.sh
        run: bash scripts/check-module-tests.sh

  backend:
    name: 后端 · Maven 单测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 项目没有 mvnw，用 runner 自带的 Maven + 这里钉死的 JDK 21。
      # cache: maven 会缓存 ~/.m2/repository（不含 settings.xml，
      # 所以 CI 上的 Maven 走默认的官方中央仓，不受 ADR 0010 的国内源影响）。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 7 个测试全是纯 JUnit 5，不拉 Spring 上下文、不触发 Flyway、不需要数据库。
      - name: 跑单元测试
        working-directory: quizzy-server
        run: mvn -B -ntp test

  # 接口与服务集成层：真 Spring 上下文 + 真 MySQL（由 Testcontainers 自己起，所以**不需要 services**）。
  # 与上面 backend job 的分工就是最后那个命令：backend 跑 `mvn test`（纯单元，不需要 Docker），
  # 这里跑 `mvn verify`——多出来的那一段是 failsafe 接手的 `*IT`。
  # ⚠️ `mvn verify` 会把单元测试也再跑一遍。刻意不为此加自定义开关：多跑 7 个毫秒级用例，
  #    换「命令保持标准、没有第二套私有属性」是划算的。
  api:
    name: 接口 · 契约与数据边界（Testcontainers）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers 要拉 mysql:8：匿名额度按共享出口 IP 计、很容易撞顶（同类约束见 ADR 0010）。
      - name: 登录 Docker Hub（未配 secrets 时跳过）
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 跑接口层
        working-directory: quizzy-server
        run: mvn -B -ntp verify

  frontend:
    name: 前端 · 类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quizzy-web
    steps:
      - uses: actions/checkout@v7

      # cache-dependency-path 是相对仓库根解析的，而 lockfile 在子目录里；
      # 不显式写的话 setup-node 会去根目录找，找不到就静默跳过缓存。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quizzy-web/package-lock.json

      # npm ci 而不是 npm install：严格按 lockfile 装，顺便把「锁文件过期」也变成门禁项。
      - run: npm ci
      # vite build 走 esbuild 只剥离类型、不做检查，所以类型错误只会被这一步挡住。
      - run: npm run typecheck
      - run: npm run build

    # 下面两个冒烟 job 不设 needs，与前后端并行。理由见 ADR 0009 / 0010：
    # 它们回答的是「Dockerfile 在干净 Linux 上还能不能从零构建」，
    # 而那类坑**只在这种环境下暴露**，本机因为缓存命中永远发现不了，不该被别的 job 挡住。
  # 移动端（uni-app，本轮只出 H5）。与 frontend 对称：只有类型检查与构建两个门禁。
  # 额外的 types 镜像守卫：移动端不引共享包（ADR 0019），types 是逐份复制的镜像，
  # 这条 diff 把「两份必须一致」从约定变成可验证断言——不这么兜，复制必然漂。
  mobile:
    name: 移动端 · 类型检查与构建（H5）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quizzy-mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quizzy-mobile/package-lock.json

      - run: npm ci
      # uni 的 build 同样只剥离类型、不做检查，类型错误只能靠这一步挡住。
      - run: npm run typecheck
      - run: npm run build:h5
      - name: types 镜像守卫（与 quizzy-web 必须逐字一致）
        run: diff -u ../quizzy-web/src/types/index.ts src/types/index.ts

  # 端到端：真浏览器 + 真后端 + 真库。这是**本项目第一次在流水线里真正启动后端**——
  # 此前 `mvn test` 不拉 Spring、镜像 job 只 `docker build`，文件末尾还明写「刻意不 compose up」。
  # 环境是**一次性的**：mysql:8 service（空库，Flyway 从零迁移）+ 进程起后端 + preview 起前端，
  # 跑完随 runner 一起销毁，不碰任何人的 dev 库。
  # ⚠️ 测试配置**直接注入 env、不建 .env 文件**——`.env` 一旦入库就成了第二份会漂的配置真相源
  #    （ADR 0006），这同时解开了「不敢 compose up」那个结（其根因就是仓库没有 .env、
  #    而 `${QUIZZY_JWT_SECRET:?...}` 是必填断言）。逐条取舍见 docs/adr/0020-layered-test-system.md。
  e2e:
    name: 端到端 · 全栈主链路（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 release.yml 的迁移重放 job 同一个 pattern，保持心智一致。
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quizzy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # 测试专用值：只活在这个 job 里，密钥不是秘密（不签任何真实数据），但仍不进仓库、不上屏。
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/quizzy?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # ≥32 字节：JwtUtil 走 HMAC-SHA256（Keys.hmacShaKeyFor），短了会直接启动失败。
      QUIZZY_JWT_SECRET: e2e-only-secret-not-used-anywhere-else-0123456789abcdef
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 后台起后端，再等它就绪。探的是 /v3/api-docs——与容器 healthcheck 同一个端点（ADR 0012），
      # 所以这段等待逻辑验的就是线上验的那件事，而不是另立一个「就绪」定义。
      # 等不到就打印日志尾部再失败，免得只看到一句「超时」。
      - name: 起后端并等就绪
        run: |
          set -euo pipefail
          ( cd quizzy-server && nohup mvn -B -ntp spring-boot:run > /tmp/backend.log 2>&1 & )
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/v3/api-docs; then
              echo "==> 后端就绪（等了 $((i * 5))s）"; exit 0
            fi
            sleep 5
          done
          echo "::error::后端 300s 内没有就绪"
          tail -100 /tmp/backend.log
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quizzy-web/package-lock.json

      # 前端要自己构建一份：job 之间不共享产物。这里**刻意不跑 typecheck**——
      # 那是 `frontend` job 的门禁，重复一遍只会让两处都得维护。
      # `vite build` 走 esbuild 只剥离类型、不做检查，所以这一步不会因为类型错误而红。
      - name: 构建前端并 preview 起服务
        working-directory: quizzy-web
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # ⚠️ `--host 127.0.0.1` 不能省。Vite 的 preview 默认 host 是 `localhost`，
          #    而 ubuntu runner 上 `localhost` 会解析到 IPv6 的 `::1` → 只监听 `::1`，
          #    于是 curl 127.0.0.1 每次都「0ms 直接拒绝」，看起来像服务没起来。
          #    本机 Windows 上 localhost 就是 127.0.0.1，所以本机测不出这个坑（首次 CI 就这样红过）。
          nohup node node_modules/vite/bin/vite.js preview --port 5173 --strictPort --host 127.0.0.1 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/; then
              echo "==> 前端就绪"; exit 0
            fi
            sleep 2
          done
          echo "::error::前端 60s 内没有就绪"
          cat /tmp/web.log
          # 顺带把「到底绑到哪了」打出来——上次只有一句「连不上」，看不出是端口没监听还是绑错地址。
          ss -tlnp 2>/dev/null | grep -F 5173 || echo "（5173 上没有任何监听）"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 装依赖与浏览器
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # preview 与后端同机：前端请求 `/api/**` 由 vite preview 代理到 127.0.0.1:8080。
      # 这一点已实测（`/api/auth/me` 返回 500 而不是 SPA 的 HTML 回退），不是照着 dev 的直觉推的。
      - name: 跑端到端
        working-directory: e2e
        run: npm test

      # 失败时把 trace / 截图 / HTML 报告收上来——否则 CI 上只看到一句「用例失败」。
      - name: 上传失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker-server:
    name: 镜像 · 后端冒烟构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets 不能出现在 if: 里（GitHub 会报 Unrecognized named-value: 'secrets'
    # 并让整个 workflow 文件作废），所以先在 job 级把它折算成一个普通布尔放进 env，
    # step 再判 env。密钥值本身不进 env，只传「有没有」。
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      # 拉基础镜像走认证额度：匿名是 100 次/6 小时且按共享出口 IP 计，
      # GitHub runner 的出口 IP 是大家共用的，很容易撞顶；认证后按账号计且翻倍。
      # secrets 没配、或 public 仓库的 fork PR（拿不到 secrets）时整步跳过，
      # 构建照跑，只是有匿名限流风险。
      - name: 登录 Docker Hub（未配 secrets 时跳过）
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建上下文与 docker-compose.prod.yml 里的 build: ./quizzy-server 一致。
      # CI 在境外 runner 上，切回官方中央仓比走阿里云更快也更稳。
      - name: docker build（Maven 走官方源）
        run: docker build --build-arg MAVEN_MIRROR=central ./quizzy-server

  docker-web:
    name: 镜像 · 前端冒烟构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: 登录 Docker Hub（未配 secrets 时跳过）
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build（npm 走官方源）
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org ./quizzy-web

  # 注意：这里刻意不 docker compose up。仓库里没有 .env，而
# ${QUIZZY_JWT_SECRET:?...} 是 ADR 0011 刻意设的必填语法，缺变量时 compose 在
# 读配置阶段就退出——那会变成一个看起来像 CI 挂了的假失败。
# 同理 MYSQL_DATA_DIR 的默认 E:/... 在 Linux runner 上也毫无意义。
# 所以 CI 只验证「镜像能构建」，不验证「服务能起来」。
