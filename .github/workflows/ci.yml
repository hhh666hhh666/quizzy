name: CI

# 触发：主干 push + 指向主干的 PR。
# 用 GitHub 托管 runner，不用 self-hosted：本仓库是 public 的，
# 把 runner 装在开发机上等于让任何能开 PR 的人在那台机器上执行代码（见 ADR 0013）。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 最小权限：只读代码。不推镜像、不发包、不改 PR，所以不需要任何写权限。
permissions:
  contents: read

# 同一分支上连续 push 时只保留最新一次运行，省 runner 也省 Docker Hub 的拉取配额。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: 后端 · Maven 单测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 项目没有 mvnw，用 runner 自带的 Maven + 这里钉死的 JDK 21。
      # cache: maven 会缓存 ~/.m2/repository（不含 settings.xml，
      # 所以 CI 上的 Maven 走默认的官方中央仓，不受 ADR 0010 的国内源影响）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 7 个测试全是纯 JUnit 5，不拉 Spring 上下文、不触发 Flyway、不需要数据库。
      - name: 跑单元测试
        working-directory: quizzy-server
        run: mvn -B -ntp test

  frontend:
    name: 前端 · 类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quizzy-web
    steps:
      - uses: actions/checkout@v4

      # cache-dependency-path 是相对仓库根解析的，而 lockfile 在子目录里；
      # 不显式写的话 setup-node 会去根目录找，找不到就静默跳过缓存。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quizzy-web/package-lock.json

      # npm ci 而不是 npm install：严格按 lockfile 装，顺便把「锁文件过期」也变成门禁项。
      - run: npm ci
      # vite build 走 esbuild 只剥离类型、不做检查，所以类型错误只会被这一步挡住。
      - run: npm run typecheck
      - run: npm run build

  # 下面两个冒烟 job 不设 needs，与前后端并行。理由见 ADR 0013：
  # 它们回答的是「Dockerfile 在干净 Linux 上还能不能从零构建」，
  # 这正是 ADR 0009 / 0010 记的那类坑唯一能暴露的地方，不该被别的 job 挡住。
  docker-server:
    name: 镜像 · 后端冒烟构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets 不能出现在 if: 里（GitHub 会报 Unrecognized named-value: 'secrets'
    # 并让整个 workflow 文件作废），所以先在 job 级把它折算成一个普通布尔放进 env，
    # step 再判 env。密钥值本身不进 env，只传「有没有」。
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # 拉基础镜像走认证额度：匿名是 100 次/6 小时且按共享出口 IP 计，
      # GitHub runner 的出口 IP 是大家共用的，很容易撞顶；认证后按账号计且翻倍。
      # secrets 没配、或 public 仓库的 fork PR（拿不到 secrets）时整步跳过，
      # 构建照跑，只是有匿名限流风险。
      - name: 登录 Docker Hub（未配 secrets 时跳过）
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建上下文与 docker-compose.prod.yml 里的 build: ./quizzy-server 一致。
      # CI 在境外 runner 上，切回官方中央仓比走阿里云更快也更稳。
      - name: docker build（Maven 走官方源）
        run: docker build --build-arg MAVEN_MIRROR=central ./quizzy-server

  docker-web:
    name: 镜像 · 前端冒烟构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录 Docker Hub（未配 secrets 时跳过）
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build（npm 走官方源）
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org ./quizzy-web

# 注意：这里刻意不 docker compose up。仓库里没有 .env，而
# ${QUIZZY_JWT_SECRET:?...} 是 ADR 0011 刻意设的必填语法，缺变量时 compose 在
# 读配置阶段就退出——那会变成一个看起来像 CI 挂了的假失败。
# 同理 MYSQL_DATA_DIR 的默认 E:/... 在 Linux runner 上也毫无意义。
# 所以 CI 只验证「镜像能构建」，不验证「服务能起来」。
