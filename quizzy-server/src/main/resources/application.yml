server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: quizzy-server

  datasource:
    # 默认值供本机开发用（mvn spring-boot:run 直连 3306）；
    # 容器里由 compose 注入 SPRING_DATASOURCE_* 覆盖，指向 mysql 服务。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/quizzy?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      update-strategy: not_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.quizzy: debug
    org.springframework.web: info

quizzy:
  jwt:
    # 容器里由 compose 注入 QUIZZY_JWT_SECRET 覆盖；默认串仅供本机开发，
    # 任何非本机环境都必须在 .env 里换成随机值。
    secret: ${QUIZZY_JWT_SECRET:quizzy-default-jwt-secret-please-replace-in-production-0123456789abcdef}
    expire-days: ${QUIZZY_JWT_EXPIRE_DAYS:7}
